<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Brain Left Hemisphere Gradient (Cool Violet Cyan) -->
    <linearGradient id="brainLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Brain Right Hemisphere / Repair Arc Gradient (Emerald Green & Gold Repair Glow) -->
    <linearGradient id="repairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Wrench Tool / Gear Accent Gradient -->
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#6366F1" opacity="0.15" filter="url(#strongGlow)" />

  <!-- BRAIN LEFT HEMISPHERE (Organ/Synapse Folds) -->
  <g filter="url(#glow)">
    <!-- Left Cerebral Cortex Outer & Inner Folds -->
    <path d="M 240 100
             C 170 100, 110 140, 110 210
             C 110 245, 125 270, 140 290
             C 120 310, 115 340, 135 370
             C 155 400, 190 410, 220 390
             C 235 380, 240 365, 240 350
             L 240 100 Z" 
          fill="none" stroke="url(#brainLeftGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
          
    <path d="M 235 155 
             C 185 155, 155 185, 160 225
             C 165 260, 195 270, 200 295
             C 205 320, 175 345, 215 345" 
          fill="none" stroke="url(#brainLeftGrad)" stroke-width="14" stroke-linecap="round"/>

    <path d="M 190 195 C 175 220, 210 240, 235 230" fill="none" stroke="url(#brainLeftGrad)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- BRAIN RIGHT HEMISPHERE (Digital Cybernetic & Repair Structure) -->
  <g filter="url(#glow)">
    <!-- Right Cerebral Cortex Arc (Circuit lines & Healing nodes) -->
    <path d="M 272 100
             C 342 100, 402 140, 402 210
             C 402 245, 387 270, 372 290
             C 392 310, 397 340, 377 370
             C 357 400, 322 410, 292 390
             C 277 380, 272 365, 272 350" 
          fill="none" stroke="url(#repairGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neural Circuits and Repair Lines -->
    <path d="M 277 160 L 330 160 L 360 190 L 360 230 L 315 250" fill="none" stroke="url(#repairGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 330 270 L 365 305 L 340 345 L 277 345" fill="none" stroke="url(#repairGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- REPAIR TOOL OVERLAY (Golden Wrench & Healing Spark Overlay in Center Right) -->
  <g filter="url(#strongGlow)" transform="translate(256, 256) rotate(-25) translate(-256, -256)">
    <!-- Sleek Mechanical Wrench fixing neural node -->
    <!-- Wrench handle -->
    <path d="M 290 320 L 360 390 C 370 400, 385 400, 395 390 C 405 380, 405 365, 395 355 L 325 285" fill="none" stroke="url(#wrenchGrad)" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Wrench head wrapping around a glowing node -->
    <path d="M 290 250 
             C 270 240, 255 260, 265 285 
             C 275 310, 305 310, 315 295
             C 325 280, 310 260, 290 250" 
          fill="none" stroke="url(#wrenchGrad)" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Glowing Nodes & Sparkles (Representing active healing & repair sparks) -->
  <circle cx="240" cy="100" r="10" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="272" cy="100" r="10" fill="#34D399" filter="url(#glow)"/>
  <circle cx="360" cy="190" r="8" fill="#F59E0B" filter="url(#glow)"/>
  <circle cx="365" cy="305" r="8" fill="#34D399" filter="url(#glow)"/>
  <circle cx="215" cy="345" r="8" fill="#C084FC" filter="url(#glow)"/>
  
  <!-- Sparkle Stars -->
  <!-- Spark 1 -->
  <path d="M 390 130 Q 390 145 405 145 Q 390 145 390 160 Q 390 145 375 145 Q 390 145 390 130 Z" fill="#FDE047" filter="url(#glow)"/>
  <!-- Spark 2 -->
  <path d="M 120 140 Q 120 150 130 150 Q 120 150 120 160 Q 120 150 110 150 Q 120 150 120 140 Z" fill="#38BDF8" filter="url(#glow)"/>
  <!-- Spark 3 (Center Fix Pulse) -->
  <path d="M 256 220 Q 256 240 276 240 Q 256 240 256 260 Q 256 240 236 240 Q 256 240 256 220 Z" fill="#10B981" filter="url(#strongGlow)"/>

  <!-- Medical/Healing Cross Spark in heart of brain -->
  <g filter="url(#strongGlow)" opacity="0.9">
    <rect x="248" y="224" width="16" height="32" rx="4" fill="#6EE7B7"/>
    <rect x="240" y="232" width="32" height="16" rx="4" fill="#6EE7B7"/>
  </g>
</svg>
